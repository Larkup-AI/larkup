services:
  larkup:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - '4567:4567'
      # Generated local RAG servers use this fixed port.
      - '8081:8081'
    environment:
      NODE_ENV: production
      TMPDIR: /app/.tmp
    volumes:
      - larkup_data:/app/.larkup
      - larkup_tmp:/app/.tmp
    restart: unless-stopped

volumes:
  larkup_data:
  larkup_tmp:
