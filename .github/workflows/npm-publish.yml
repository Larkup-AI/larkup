name: Publish Packages to npm

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build --filter "!@larkup/desktop"

      - name: Publish to npm
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait for the published tarball
        id: release-version
        shell: bash
        run: |
          version=$(node -p "require('./apps/web/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tarball="https://registry.npmjs.org/larkup/-/larkup-${version}.tgz"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --head "$tarball" >/dev/null; then
              echo "larkup@$version tarball is available."
              exit 0
            fi
            echo "Waiting for npm tarball propagation ($attempt/60)..."
            sleep 10
          done
          echo "larkup@$version metadata was published, but its tarball is still unavailable." >&2
          exit 1

  installer-smoke:
    name: ${{ matrix.name }} published install
    needs: build-and-publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: macOS Intel
            # macos-13 is the supported GitHub-hosted Intel runner.
            os: macos-13
          - name: macOS Apple Silicon
            os: macos-14
          - name: Windows x64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      LARKUP_INSTALL_VERSION: ${{ needs.build-and-publish.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # `shell` does not support the matrix context. Keep the OS-specific
      # commands as static steps so GitHub can validate the workflow before
      # scheduling its matrix jobs.
      - name: Validate published install and server health (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/test-release-install.sh
      - name: Validate published install and server health (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-release-install.ps1
