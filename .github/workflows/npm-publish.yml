name: Publish Packages to npm

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build --filter "!@larkup/desktop"

      - name: Publish to npm
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  installer-smoke:
    name: ${{ matrix.name }} published install
    needs: build-and-publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            command: scripts/test-release-install.sh
          - name: macOS Intel
            os: macos-15-intel
            command: scripts/test-release-install.sh
          - name: macOS Apple Silicon
            os: macos-14
            command: scripts/test-release-install.sh
          - name: Windows x64
            os: windows-2025
            command: ./scripts/test-release-install.ps1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Validate published install and server health
        shell: ${{ startsWith(matrix.os, 'windows') && 'pwsh' || 'bash' }}
        run: ${{ matrix.command }}
