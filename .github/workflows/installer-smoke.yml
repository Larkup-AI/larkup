name: Installer Smoke Tests

on:
  pull_request:
    paths:
      - 'scripts/install.sh'
      - 'scripts/install.ps1'
      - 'scripts/install-local.sh'
      - 'scripts/test-release-install.*'
      - 'scripts/test-candidate-install.*'
      - '.github/workflows/installer-smoke.yml'
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - 'scripts/install.sh'
      - 'scripts/install.ps1'
      - 'scripts/install-local.sh'
      - 'scripts/test-release-install.*'
      - 'scripts/test-candidate-install.*'
      - '.github/workflows/installer-smoke.yml'
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:

concurrency:
  group: installer-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unix:
    name: ${{ matrix.name }} clean install
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: macOS Intel
            os: macos-15-intel
          - name: macOS Apple Silicon
            os: macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install candidate build dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate installer shell scripts
        run: scripts/test-install-scripts.sh
      - name: Candidate package install, ffprobe, and server check
        run: scripts/test-candidate-install.sh
      # A source push cannot change the package already on npm. Keep the public
      # release monitor independent from candidate validation so installer fixes
      # can become green before they are published.
      - name: Published release clean install and server health check
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: scripts/test-release-install.sh

  windows:
    name: Windows x64 clean install
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install candidate build dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate and dry-run Windows installer
        shell: powershell
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './scripts/install.ps1'),
            [ref]$null,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            exit 1
          }
          ./scripts/install.ps1 -DryRun -NoPrompt
      - name: Candidate package install, ffprobe, and server check
        shell: pwsh
        run: ./scripts/test-candidate-install.ps1
