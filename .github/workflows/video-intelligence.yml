name: Video Intelligence

on:
  pull_request:
    paths:
      - packages/tools/video-intelligence/**
      - packages/marketplace/**
      - apps/marketplace/**
      - .github/workflows/video-intelligence.yml
  push:
    branches: [main]
    tags: ['video-intelligence-v*']
    paths:
      - packages/tools/video-intelligence/**
      - packages/marketplace/**
      - apps/marketplace/**
      - .github/workflows/video-intelligence.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the linux/amd64 RunPod worker image to private GHCR
        type: boolean
        default: true

concurrency:
  group: video-intelligence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: Type-check and test extension contracts
        run: |
          pnpm --filter @larkup/marketplace type-check
          pnpm --filter @larkup/tool-video-intelligence type-check
          pnpm --filter @larkup/tool-video-intelligence test
      - name: Test quota and access-code state
        working-directory: packages/tools/video-intelligence
        env:
          PYTHONPATH: runtime
        run: python -m unittest discover -s runtime/tests -p 'test_*.py'
      - name: Check Python syntax
        run: python -m compileall -q packages/tools/video-intelligence/runtime packages/tools/video-intelligence/deploy/aws/control_plane

  container-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Build lightweight API smoke target
        run: docker build --target smoke -t larkup-video-smoke packages/tools/video-intelligence/runtime
      - name: Build installable cross-platform CPU target
        run: docker build --target cpu -t larkup-video-cpu packages/tools/video-intelligence/runtime
      - name: Exercise health endpoint
        run: |
          docker run --detach --name larkup-video-smoke --publish 8787:8787 larkup-video-smoke
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/v1/health; then exit 0; fi
            sleep 2
          done
          docker logs larkup-video-smoke
          exit 1

  validate-infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/setup-sam@v2
      - name: Validate deployable AWS template
        working-directory: packages/tools/video-intelligence/deploy/aws
        run: sam validate --lint

  publish-runpod-image:
    if: >-
      startsWith(github.ref, 'refs/tags/video-intelligence-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [container-smoke, validate-infrastructure]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Sign in to private GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish immutable linux/amd64 RunPod worker
        id: image
        env:
          REGISTRY: ghcr.io
          IMAGE_TAG: ${{ github.sha }}
        run: |
          repository="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/video-intelligence"
          image_uri="${REGISTRY}/${repository}:${IMAGE_TAG}"
          docker buildx build \
            --platform linux/amd64 \
            --target runtime \
            --push \
            --tag "${image_uri}" \
            packages/tools/video-intelligence/runtime
          echo "uri=${image_uri}" >> "${GITHUB_OUTPUT}"
      - name: Report private image reference
        run: echo "${{ steps.image.outputs.uri }}"
