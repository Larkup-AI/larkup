version: 2
updates:
  # pnpm / npm ecosystem
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    groups:
      all-npm-deps:
        patterns:
          - '*'
    ignore:
      # LanceDB 0.37.1 only accepts apache-arrow through 18.1.0.
      - dependency-name: 'apache-arrow'
        versions: ['>18.1.0']

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      all-actions:
        patterns:
          - '*'
