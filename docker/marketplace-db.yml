# Local Postgres for Marketplace development.
services:
  marketplace-db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=larkup
      - POSTGRES_PASSWORD=larkup
      - POSTGRES_DB=larkup_hub
    ports:
      - '5433:5432'
    volumes:
      - marketplace_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U larkup -d larkup_hub']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  marketplace_db_data:
